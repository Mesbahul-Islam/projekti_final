version: "3.8"

services:
  rebalancer:
    image: docker:27-cli
    configs:
      - source: rebalancer_script
        target: /rebalancer.sh
        mode: 0555
    environment:
      STACK_NAME: hello
      POLL_SECONDS: "15"
      COOLDOWN_SECONDS: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sh", "/rebalancer.sh"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
  hello_tx:
    image: local/hello_tx:1
    hostname: hello_tx
    deploy:
      replicas: 1
  hello_rx:
    image: local/hello_rx:1
    hostname: hello_rx
    deploy:
      replicas: 1
  hello_tx2:
    image: local/hello_tx2:1
    hostname: hello_tx2
    deploy:
      replicas: 1
  hello_rx2:
    image: local/hello_rx2:1
    hostname: hello_rx2
    deploy:
      replicas: 1

configs:
  rebalancer_script:
    file: ./rebalancer/rebalancer.sh
