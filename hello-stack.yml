version: "3.8"

services:
  rebalancer:
    image: docker:27-cli
    configs:
      - source: rebalancer_script
        target: /rebalancer.sh
        mode: 0555
    environment:
      STACK_NAME: hello
      POLL_SECONDS: "15"
      COOLDOWN_SECONDS: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sh", "/rebalancer.sh"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
  task1:
    image: local/task1:1
    hostname: task1
    deploy:
      replicas: 1
  task2:
    image: local/task2:1
    hostname: task2
    deploy:
      replicas: 1
  task3:
    image: local/task3:1
    hostname: task3
    deploy:
      replicas: 1
  task4:
    image: local/task4:1
    hostname: task4
    deploy:
      replicas: 1

configs:
  rebalancer_script:
    file: ./rebalancer/rebalancer.sh
